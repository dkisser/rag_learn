[project]
name = "rag-learn"
version = "0.1.0"
description = "A progressive RAG learning project on Chroma: every optimization starts from a number on an eval report (recall@k, MRR, NDCG, LLM-judge metrics)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pin upper bounds to the major versions the implementation plan was
    # written against. Latest majors have changed APIs (chromadb 1.x,
    # pymilvus 3.x, openai 2.x, gradio 6.x) that would silently break the
    # plan code blocks. Bumping is a separate, deliberate effort.
    "chromadb>=0.5,<1",
    # pymilvus 2.6 split milvus-lite into a separate optional dep, and the
    # default embedder path was removed in favor of `pymilvus[model]`. We
    # pull in both extras to enable Lite (embedded) mode + the
    # SentenceTransformerEmbeddingFunction used by MilvusRetriever.
    # `sentence-transformers` is also listed explicitly below because uv's
    # lock resolver doesn't always pull transitive extras from a single
    # `pymilvus[milvus_lite,model]` marker across all Python versions, and
    # tests that import MilvusRetriever need it on the path before the
    # adapter's lazy import runs.
    "pymilvus[milvus_lite,model]>=2.4,<3",
    "sentence-transformers>=2.0",
    "openai>=1.40,<2",
    "gradio>=5.0,<6",
    "python-dotenv>=1.0",
    # Rate limiting for batch eval CLI: pyrate-limiter gives us a sync token/
    # leaky bucket for RPM pacing; tenacity is the standard retry library
    # (Apache 2.0) used here only for 429 backoff. Both are pure-Python and
    # have stable APIs in the pinned major versions.
    "pyrate-limiter>=3,<5",
    "tenacity>=9,<10",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rag_learn --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_learn"]
